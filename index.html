<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="theme-color" content="#000000" />
  <title>Pip Quest</title>

  <!-- iOS PWA -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Pip Quest" />
  <meta name="mobile-web-app-capable" content="yes" />
  <link rel="apple-touch-icon" href="icons/icon-192.png" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div id="stage">
    <div id="screen">
      <canvas id="gl"></canvas>
      <canvas id="game"></canvas>
    </div>

    <button id="mute" class="sysbtn" aria-label="mute">&#128266;</button>

    <div id="controls">
      <!-- Left half: floating stick (touch anywhere, drag to move) -->
      <div id="lzone">
        <div class="stick" id="stick"><div class="knob" id="knob"></div></div>
      </div>
      <!-- Right half: action buttons; roll the thumb between them -->
      <div id="rzone">
        <div class="btn spin" data-act="spin">Y</div>
        <div class="btn run" data-act="run">B</div>
        <div class="btn jump" data-act="jump">A</div>
      </div>
    </div>
    <button id="startbtn" class="centerbtn" data-btn="start" aria-label="start">START</button>
  </div>

  <!-- three.js (MIT, vendored) for the 2.5D renderer; modules run before DOMContentLoaded -->
  <script type="module">
    import * as THREE from './vendor/three.module.min.js';
    window.THREE = THREE;
  </script>
  <!-- Data -->
  <script src="js/data/tiles.js"></script>
  <script src="js/data/save.js"></script>
  <!-- Engine -->
  <script src="js/engine/renderer.js"></script>
  <script src="js/engine/text.js"></script>
  <script src="js/engine/input.js"></script>
  <script src="js/engine/audio.js"></script>
  <script src="js/engine/physics.js"></script>
  <script src="js/engine/sprites.js"></script>
  <script src="js/engine/backgrounds.js"></script>
  <script src="js/engine/render3d.js"></script>
  <script src="js/data/levels.js"></script>
  <!-- Game -->
  <script src="js/game/entities.js"></script>
  <script src="js/game/player.js"></script>
  <script src="js/game/enemies.js"></script>
  <script src="js/game/hud.js"></script>
  <script src="js/game/level.js"></script>
  <script src="js/game/worldmap.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
